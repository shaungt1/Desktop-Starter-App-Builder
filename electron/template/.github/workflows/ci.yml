# CI workflow generated by Desktop Starter App Builder. Runs the quality gate
# on Windows, macOS and Linux for every pull request and push to main, and the
# end-to-end tests on Linux (docs/electron/07-testing.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2 # @bun-only
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run verify

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2 # @bun-only
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Linux packages for packaging and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg fakeroot xvfb
      - run: bun install --frozen-lockfile
      - run: xvfb-run -a bun run test:e2e
