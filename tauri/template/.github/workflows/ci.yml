# Generated by Desktop Starter App Builder. Verifies every pull request on
# Windows, macOS and Linux: runs the app's quality gate, then builds the
# installers without uploading them.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest, windows-latest]

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: install Linux system packages
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: setup Bun # @bun-only
        uses: oven-sh/setup-bun@v2 # @bun-only

      - name: setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: quality gate
        run: bun run verify

      - name: build installers (no upload)
        uses: tauri-apps/tauri-action@v1

  e2e:
    # End-to-end tests drive the real app through WebDriver; Linux only (docs/tauri/08-testing-debugging.md).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: install Linux system packages and the WebKit driver
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils webkit2gtk-driver xvfb

      - name: setup Bun # @bun-only
        uses: oven-sh/setup-bun@v2 # @bun-only

      - name: setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: install tauri-driver
        run: cargo install tauri-driver --locked

      - name: install frontend dependencies
        run: bun install --frozen-lockfile

      - name: end-to-end tests
        run: xvfb-run -a bun run test:e2e
